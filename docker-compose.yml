services:
  redsocial:
    build: .
    container_name: cli-red-social
    restart: unless-stopped
    ports:
      - "2222:2222"
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - SSH_PASSWORD=${SSH_PASSWORD:-}
      - DATABASE_URL=postgres://social:${DB_PASSWORD:-social}@db/social
    command: ["cli-red-social", "--port", "2222", "--key", "/tmp/host_key"]

  db:
    image: postgres:17-alpine
    container_name: cli-red-social-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: ${DB_PASSWORD:-social}
      POSTGRES_DB: social
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
