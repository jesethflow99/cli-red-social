services:
  # ── Balanceador ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: agora-nginx
    restart: unless-stopped
    ports:
      - "${SSH_PORT:-2222}:2222"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agora1
      - agora2
      - agora3
    networks:
      - agora_net

  # ── 3 instancias Agora ──────────────────────────────
  agora1:
    build: .
    restart: unless-stopped
    expose:
      - "2222"
    volumes:
      - ./data:/data
      - ./keys/agora1_host_key:/tmp/host_key:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - SSH_PASSWORD=${SSH_PASSWORD:-agora}
      - DATABASE_URL=postgres://social:${DB_PASSWORD:-agora}@db/social
      - LANG=${LANG:-es}
      - AGORA_UPLOAD_DIR=/data/uploads
    command: ["agora", "--port", "2222", "--key", "/tmp/host_key"]
    networks:
      - agora_net

  agora2:
    build: .
    restart: unless-stopped
    expose:
      - "2222"
    volumes:
      - ./data:/data
      - ./keys/agora2_host_key:/tmp/host_key:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - SSH_PASSWORD=${SSH_PASSWORD:-agora}
      - DATABASE_URL=postgres://social:${DB_PASSWORD:-agora}@db/social
      - LANG=${LANG:-es}
      - AGORA_UPLOAD_DIR=/data/uploads
    command: ["agora", "--port", "2222", "--key", "/tmp/host_key"]
    networks:
      - agora_net

  agora3:
    build: .
    restart: unless-stopped
    expose:
      - "2222"
    volumes:
      - ./data:/data
      - ./keys/agora3_host_key:/tmp/host_key:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - SSH_PASSWORD=${SSH_PASSWORD:-agora}
      - DATABASE_URL=postgres://social:${DB_PASSWORD:-agora}@db/social
      - LANG=${LANG:-es}
      - AGORA_UPLOAD_DIR=/data/uploads
    command: ["agora", "--port", "2222", "--key", "/tmp/host_key"]
    networks:
      - agora_net

  # ── PostgreSQL ───────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: agora-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agora}
      POSTGRES_DB: social
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agora_net

  # ── Tor (opcional) ───────────────────────────────────
  tor:
    image: dperson/torproxy:latest
    container_name: agora-tor
    restart: unless-stopped
    expose:
      - "9050"
    networks:
      - agora_net

volumes:
  pgdata:

networks:
  agora_net:
    driver: bridge
