services:
  # ── AGORA (instancia única, SQLite embebido) ───────────
  agora:
    build: .
    restart: unless-stopped
    ports:
      - "${SSH_PORT:-2222}:2222"
    volumes:
      - ./data:/data
      # Montar el DIRECTORIO (no el archivo): si el archivo no existe, Docker
      # crearía un directorio vacío en su lugar y el server fallaría.
      - ./keys:/keys:ro
    environment:
      - RUST_LOG=info
      - SSH_PASSWORD=${SSH_PASSWORD:?Define SSH_PASSWORD in .env}
      - DATABASE_URL=${DATABASE_URL:-/data/agora.db}
      - LANG=${LANG:-es}
      - REGISTRATION_MODE=${REGISTRATION_MODE:-invite}
      - AGORA_UPLOAD_DIR=/data/uploads
      - AGORA_PUBLIC_HOST=${AGORA_PUBLIC_HOST:-localhost}
      - AGORA_PUBLIC_SSH_PORT=${SSH_PORT:-2222}
    command: ["agora", "--port", "2222", "--key", "/keys/agora_host_key", "--db", "/data/agora.db"]
    networks:
      - agora_net

  # ── Tor (opcional) ───────────────────────────────────
  tor:
    image: dperson/torproxy:latest
    container_name: agora-tor
    restart: unless-stopped
    expose:
      - "9050"
    networks:
      - agora_net

networks:
  agora_net:
    driver: bridge