services:
  redsocial:
    build: .
    container_name: agora
    restart: unless-stopped
    ports:
      - "${SSH_PORT:-2222}:${SSH_PORT:-2222}"
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      tor:
        condition: service_started
    environment:
      - RUST_LOG=info
      - SSH_PASSWORD=${SSH_PASSWORD:-agora}
      - DATABASE_URL=postgres://social:${DB_PASSWORD:-agora}@db/social
      - LANG=${LANG:-es}
      - TOR_PROXY=tor:9050
    command: ["agora", "--port", "${SSH_PORT:-2222}", "--key", "/tmp/host_key"]

  db:
    image: postgres:17-alpine
    container_name: agora-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agora}
      POSTGRES_DB: social
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social"]
      interval: 5s
      timeout: 5s
      retries: 5

  tor:
    image: dperson/torproxy:latest
    container_name: agora-tor
    restart: unless-stopped
    ports:
      - "9050:9050"

volumes:
  pgdata:
