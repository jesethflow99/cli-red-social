# AGORA — Nginx TCP proxy para balanceo de carga SSH
# El usuario se conecta al puerto 2222, nginx reenvía a las instancias internas
#
# Requiere: nginx con módulo stream (apt install nginx-full o nginx-extras)
# Verificar: nginx -V 2>&1 | grep -o with-stream

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    # Log de conexiones SSH (opcional, quitar en producción si molesta)
    log_format ssh '$remote_addr → $upstream_addr [$time_local]';

    upstream agora_backend {
        # Misma IP siempre va a la misma instancia (persistencia de sesión TUI)
        hash $remote_addr consistent;

        server agora1:2222;
        server agora2:2222;
        server agora3:2222;
    }

    server {
        listen 2222;
        proxy_pass agora_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;  # 1 hora, igual que el timeout SSH interno

        access_log /var/log/nginx/agora_access.log ssh;
        error_log /var/log/nginx/agora_error.log;
    }
}
