name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Keep Clippy visible while the existing advisory backlog is reduced.
      - run: cargo clippy --all-targets
      - run: cargo test --all-targets

  opentui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-opentui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui-opentui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
