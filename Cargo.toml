[package]
name = "cli-red-social"
version = "0.2.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
russh = "0.46"
russh-keys = "0.46"
r2d2 = "0.8"
r2d2_postgres = "0.18"
postgres = "0.19"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
bcrypt = "0.16"
async-trait = "0.1"
futures = "0.3"
nix = { version = "0.29", features = ["fs", "term", "process", "ioctl"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking"] }
